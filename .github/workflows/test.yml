name: Build Emilia Setup

on:
  push:
    tags: 
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repo
        uses: actions/checkout@v6.0.2

      - name: Deploy via SCP
        shell: pwsh
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # 1. Создаем файл ключа
          $keyFile = "id_rsa_deploy"
          Set-Content -Path $keyFile -Value $env:KEY -NoNewline
          
          # Ограничиваем права (для Windows ssh это не критично, но полезно)
          # На Windows это сложнее, поэтому ssh.exe часто ругается на "too open".
          # Но в GitHub Actions обычно работает сразу.

          # 2. Добавляем хост в known_hosts (чтобы не спрашивал yes/no)
          mkdir -p ~/.ssh
          ssh-keyscan -H $env:HOST >> ~/.ssh/known_hosts

          # 3. Заливаем файлы
          # -r : рекурсивно (всю папку)
          # -o StrictHostKeyChecking=no : отключить проверку хоста (на всякий случай)
          ssh -i $keyFile -o StrictHostKeyChecking=no $env:USER@$env:HOST "mkdir -p /home/$env:USER/emilia && rm -rf /home/$env:USER/emilia/*"
          
          Write-Host "Начинаю загрузку на VPS..."
          scp -i $keyFile -o StrictHostKeyChecking=no ./requirements.txt $env:USER@$env:HOST:/home/$env:USER/emilia
          
          # 4. Удаляем ключ
          Remove-Item $keyFile
